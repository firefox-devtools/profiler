name: CI

on:
  push:
    branches:
      - main
      - production
  pull_request:
  merge_group:

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run lint
        run: yarn lint

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run tests
        # We use workerIdleMemoryLimit to work around a memory issue with node.
        # See https://github.com/facebook/jest/issues/11956
        run: yarn test --coverage --logHeapUsage -w=4 --workerIdleMemoryLimit=1.5G

      - name: Run deployment script tests
        run: yarn test-deploy-prod

      - name: Run bundle size script tests
        run: yarn test-bundle-size

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false

  cli-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run CLI tests
        run: yarn test-cli

  build-prod:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Build production
        run: yarn build-prod:quiet

      - name: Build node tools
        run: yarn build-node-tools

      - name: Upload node-tools-dist artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: node-tools-dist
          path: node-tools-dist/

      - name: Build profiler-cli
        run: yarn build-cli

      - name: Upload profiler-cli artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: profiler-cli
          path: profiler-cli/dist/

      # The bundle size steps come last, so that the builds above always run.
      # A pull request is built merged with the tip of its base branch, the
      # first parent of the merge commit. Its sizes are the ones to compare
      # with, saved below by the runs on main.
      - name: Find the commit to compare the bundle size with
        id: bundle-size-base
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE_SHA=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -1)
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.before }}

      - name: Restore the bundle size of that commit
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache/restore@v6
        with:
          path: build-meta/bundle-size.json
          key: bundle-size-${{ steps.bundle-size-base.outputs.sha }}

      # Without this list, the sizes are measured as for any pull request.
      - name: List the files of the pull request
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        continue-on-error: true
        run: mkdir -p build-meta && gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" --paginate --jq '.[].filename' > build-meta/changed-files.txt
        env:
          GH_TOKEN: ${{ github.token }}

      # A pull request about documentation leaves the measured files as they
      # are: the script sees it from its files, and the "documentation" label
      # says it too. The sizes of a pull request go to the artifact of its
      # report.

      - name: Profiler Bundle Size Reporter
        if: matrix.os == 'ubuntu-latest' && !contains(github.event.pull_request.labels.*.name, 'documentation')
        run: yarn bundle-size --baseline build-meta/bundle-size.json --output ${{ github.event_name == 'pull_request' && 'build-meta/bundle-size-report/sizes.json' || 'build-meta/bundle-size.json' }} --changed-files build-meta/changed-files.txt

      - name: Save the bundle size for future comparisons
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: build-meta/bundle-size.json
          key: bundle-size-${{ github.sha }}

      # The "Bundle size report" workflow renders these sizes on the pull
      # request. These steps also run when a size is over its limit.
      - name: Gather the sizes for the bundle size report
        if: always() && github.event_name == 'pull_request' && hashFiles('build-meta/bundle-size-report/sizes.json') != ''
        run: |
          echo "$PULL_REQUEST" > build-meta/bundle-size-report/pull-request-number
          if [ -f build-meta/bundle-size.json ]; then
            cp build-meta/bundle-size.json build-meta/bundle-size-report/baseline.json
          fi
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}

      - name: Upload the sizes for the bundle size report
        if: always() && github.event_name == 'pull_request' && hashFiles('build-meta/bundle-size-report/sizes.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: bundle-size-report
          path: build-meta/bundle-size-report/

  licence-check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run license check
        run: yarn license-check

  typecheck:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run TypeScript check
        run: yarn ts

  alex:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Run alex
        run: yarn test-alex

  yarn-lock:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-and-install

      - name: Check yarn.lock
        run: yarn test-lockfile

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bin'
